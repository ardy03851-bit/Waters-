<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#06121c">
<title>Aqua · Ocean & Ball Physics Showcase</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<style>
  :root{--glass:rgba(10,20,32,.55);--stroke:rgba(255,255,255,.15);--accent:#5ee0ff;--accent2:#3b82f6}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#06121c;overscroll-behavior:none;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:#eaf6ff;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  #gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
  .glass{background:var(--glass);backdrop-filter:blur(22px) saturate(1.6);-webkit-backdrop-filter:blur(22px) saturate(1.6);
    border:1px solid var(--stroke);box-shadow:0 12px 40px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.14);border-radius:24px}
  #top{position:fixed;top:max(12px,env(safe-area-inset-top));left:max(14px,env(safe-area-inset-left));right:max(14px,env(safe-area-inset-right));
    display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;gap:10px}
  .brand{padding:10px 18px 10px 14px;display:flex;align-items:center;gap:12px}
  .logo{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,#5ee0ff,#2563eb);display:grid;place-items:center;
    box-shadow:0 4px 14px rgba(59,130,246,.55)}
  .logo svg{width:20px;height:20px}
  .brand h1{margin:0;font-size:16px;font-weight:700;letter-spacing:.2px}
  .brand p{margin:1px 0 0;font-size:11.5px;opacity:.65}
  .stats{padding:9px 14px;font:600 12px/1.3 ui-monospace,SFMono-Regular,Menlo,monospace;text-align:right;opacity:.9;border-radius:16px}
  #hint{position:fixed;left:50%;top:max(84px,calc(env(safe-area-inset-top) + 72px));transform:translateX(-50%);padding:10px 18px;border-radius:999px;
    font-size:13.5px;font-weight:500;white-space:nowrap;pointer-events:none;transition:opacity .8s;max-width:94vw;overflow:hidden;text-overflow:ellipsis}
  #dock{position:fixed;left:50%;bottom:max(12px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(1000px,calc(100% - 24px));
    padding:12px 14px 14px;display:flex;flex-direction:column;gap:12px;transition:transform .5s cubic-bezier(.2,.9,.2,1),opacity .35s}
  #dock.hidden{transform:translate(-50%,150%);opacity:0;pointer-events:none}
  .chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding-bottom:2px}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:1 0 auto;min-width:104px;display:flex;align-items:center;gap:9px;padding:7px 14px 7px 8px;border-radius:18px;border:1px solid var(--stroke);
    background:rgba(255,255,255,.06);color:inherit;font:600 13px/1.15 inherit;min-height:50px;text-align:left;cursor:pointer;transition:all .2s}
  .chip small{display:block;font-weight:500;opacity:.55;font-size:10.5px;margin-top:2px}
  .chip.on{background:linear-gradient(135deg,rgba(94,224,255,.28),rgba(59,130,246,.3));border-color:rgba(94,224,255,.75);box-shadow:0 0 0 1px rgba(94,224,255,.25),0 6px 20px rgba(59,130,246,.3)}
  .sw{width:34px;height:34px;border-radius:50%;flex:none;position:relative;box-shadow:inset -4px -5px 9px rgba(0,0,0,.4),0 3px 8px rgba(0,0,0,.35)}
  .sw::after{content:"";position:absolute;left:20%;top:14%;width:32%;height:22%;border-radius:50%;background:rgba(255,255,255,.6);filter:blur(1.5px);transform:rotate(-32deg)}
  .row{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap}
  .ctl{flex:1 1 190px;display:flex;flex-direction:column;gap:0;font-size:12px;font-weight:600;min-width:150px}
  .ctl .lab{display:flex;justify-content:space-between;opacity:.85;letter-spacing:.3px;text-transform:uppercase;font-size:10.5px}
  .ctl .lab b{color:var(--accent);font-weight:700}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:38px;background:transparent;margin:0;touch-action:pan-y}
  input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2) var(--p,50%),rgba(255,255,255,.18) var(--p,50%))}
  input[type=range]::-moz-range-track{height:6px;border-radius:99px;background:rgba(255,255,255,.18)}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;margin-top:-11px;background:#fff;
    box-shadow:0 2px 10px rgba(0,0,0,.45),0 0 0 4px rgba(94,224,255,.25)}
  input[type=range]::-moz-range-thumb{width:28px;height:28px;border-radius:50%;background:#fff;border:0}
  .acts{display:flex;gap:8px;flex-wrap:wrap}
  .btn{min-height:48px;padding:0 18px;border-radius:16px;border:1px solid var(--stroke);background:rgba(255,255,255,.08);color:inherit;font:600 14px/1 inherit;cursor:pointer;
    display:inline-flex;align-items:center;gap:8px;transition:transform .12s,background .2s}
  .btn:active{transform:scale(.95)}
  .btn.primary{background:linear-gradient(135deg,#34d3ff,#3b82f6);color:#02111c;border:0;box-shadow:0 6px 22px rgba(59,130,246,.5)}
  .btn.on{background:rgba(94,224,255,.25);border-color:rgba(94,224,255,.7)}
  #fab{position:fixed;right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));min-height:52px;padding:0 20px;border-radius:26px;
    display:none;align-items:center;gap:8px;color:inherit;font:700 14px/1 inherit;cursor:pointer}
  #fab.show{display:inline-flex}
  #fail,#err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:30px;background:#06121c;z-index:99;font-size:15px;line-height:1.5;white-space:pre-wrap}
  #err{justify-content:flex-start;align-items:flex-start;font:11px/1.35 ui-monospace,Menlo,monospace;overflow:auto;color:#ffb4b4}
  @media (max-width:760px){.brand p{display:none}.chip{min-width:96px}}
</style>
</head>
<body>
<canvas id="gl"></canvas>

<div id="top">
  <div class="brand glass">
    <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#02111c" stroke-width="2.4" stroke-linecap="round"><path d="M2 14c2.5-3 4.5-3 7 0s4.5 3 7 0 4.5-3 6 0"/><circle cx="12" cy="6" r="2.4" fill="#02111c" stroke="none"/></svg></div>
    <div><h1>Aqua</h1><p>Ocean &amp; ball physics showcase</p></div>
  </div>
  <div class="stats glass" id="stats">—</div>
</div>

<div id="hint" class="glass">Tap the sea to drop a ball · Drag to orbit · Pinch to zoom · Grab a ball and fling it</div>

<section id="dock" class="glass">
  <div class="chips" id="chips"></div>
  <div class="row">
    <label class="ctl"><span class="lab">Ball size <b id="vSize">1.0×</b></span><input id="sSize" type="range" min="50" max="220" value="100"></label>
    <label class="ctl"><span class="lab">Sea state <b id="vSea">Moderate</b></span><input id="sSea" type="range" min="0" max="100" value="38"></label>
    <label class="ctl"><span class="lab">Sun <b id="vSun">Afternoon</b></span><input id="sSun" type="range" min="0" max="100" value="58"></label>
  </div>
  <div class="acts">
    <button class="btn primary" id="bDrop">⬇︎ Drop ball</button>
    <button class="btn" id="bRain">☔︎ Ball rain</button>
    <button class="btn" id="bSlow">◔ Slow-mo</button>
    <button class="btn" id="bClear">✕ Clear</button>
    <button class="btn" id="bHide" style="margin-left:auto">⌄ Hide</button>
  </div>
</section>
<button id="fab" class="glass">⌃ Controls</button>

<div id="fail">This showcase needs WebGL 2 (iPadOS 15+ / Safari 15+). Please update your device or browser.</div>
<div id="err"></div>

<script>
'use strict';
const $ = id => document.getElementById(id);
function showErr(m){ const e=$('err'); e.style.display='flex'; e.textContent += m + '\n'; }
window.addEventListener('error', ev => showErr(String(ev.message)));

const canvas = $('gl');
const gl = canvas.getContext('webgl2', {antialias:true, alpha:false, powerPreference:'high-performance'});
if(!gl){ $('fail').style.display='flex'; throw new Error('WebGL2 unsupported'); }

/* ============================================================
   Constants & small math helpers
   ============================================================ */
const G=9.81, RHO_W=1000, RHO_A=1.2;
const clamp=(x,a,b)=>x<a?a:x>b?b:x;
const lerp=(a,b,t)=>a+(b-a)*t;
const sstep=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
const lerp3=(a,b,t)=>[lerp(a[0],b[0],t),lerp(a[1],b[1],t),lerp(a[2],b[2],t)];

const M4={
  persp(fovy,asp,n,f){const o=new Float32Array(16),t=1/Math.tan(fovy/2);o[0]=t/asp;o[5]=t;o[10]=(f+n)/(n-f);o[11]=-1;o[14]=2*f*n/(n-f);return o;},
  look(e,c,u){
    let zx=e[0]-c[0],zy=e[1]-c[1],zz=e[2]-c[2];let l=Math.hypot(zx,zy,zz);zx/=l;zy/=l;zz/=l;
    let xx=u[1]*zz-u[2]*zy,xy=u[2]*zx-u[0]*zz,xz=u[0]*zy-u[1]*zx;l=Math.hypot(xx,xy,xz);xx/=l;xy/=l;xz/=l;
    const yx=zy*xz-zz*xy,yy=zz*xx-zx*xz,yz=zx*xy-zy*xx;
    return new Float32Array([xx,yx,zx,0,xy,yy,zy,0,xz,yz,zz,0,-(xx*e[0]+xy*e[1]+xz*e[2]),-(yx*e[0]+yy*e[1]+yz*e[2]),-(zx*e[0]+zy*e[1]+zz*e[2]),1]);
  },
  mul(a,b){const o=new Float32Array(16);for(let c=0;c<4;c++)for(let r=0;r<4;r++){let s=0;for(let k=0;k<4;k++)s+=a[k*4+r]*b[c*4+k];o[c*4+r]=s;}return o;}
};

/* ============================================================
   Shaders
   ============================================================ */
const HDR = '#version 300 es\nprecision highp float;\nprecision highp int;\nprecision highp sampler2D;\n';

const COMMON = `
uniform sampler2D uDetail;
uniform float uTime,uStorm,uAmbLum,uSunLum,uCloudLo,uExp;
uniform vec3 uSun,uSunCol,uZenith,uHorizon,uGlow;
float hash12(vec2 p){vec3 p3=fract(vec3(p.xyx)*0.1031);p3+=dot(p3,p3.yzx+33.33);return fract((p3.x+p3.y)*p3.z);}
vec3 skyCol(vec3 rd,float sunOn){
  float h=max(rd.y,0.0);
  vec3 c=mix(uHorizon,uZenith,pow(h,0.42));
  float sd=max(dot(rd,uSun),0.0);
  c+=uGlow*(pow(sd,5.0)*0.30+pow(sd,48.0)*0.8);
  {
    vec2 cuv=rd.xz/(h+0.10)*0.20+vec2(uTime*0.0035,uTime*0.0012);
    float n=texture(uDetail,cuv).a*0.65+texture(uDetail,cuv*2.7+vec2(3.1,1.7)).a*0.35;
    float cov=smoothstep(uCloudLo,uCloudLo+0.24,n)*smoothstep(0.0,0.16,rd.y);
    vec3 cc=mix(uHorizon,vec3(1.0),0.65)*(0.5+0.5*uAmbLum);
    cc*=mix(1.0,0.42,uStorm);
    cc+=uGlow*pow(sd,3.0)*0.45;
    c=mix(c,cc,cov*0.92);
    c+=uSunCol*smoothstep(0.99965,0.99985,sd)*(1.0-cov)*step(0.5,sunOn)*step(0.0,rd.y);
  }
  return c;
}
vec3 tonemap(vec3 x){
  x*=uExp;
  vec3 c=clamp((x*(2.51*x+0.03))/(x*(2.43*x+0.59)+0.14),0.0,1.0);
  return pow(c,vec3(1.0/2.2));
}
vec3 enc(vec3 c){return c/(1.0+c);}
vec3 dec(vec3 c){c=min(c,vec3(0.995));return c/(1.0-c);}
`;

/* ---- Water vertex: Gerstner waves + ripple height ---- */
const WATER_VS = HDR + `
layout(location=0) in vec2 aUV;
uniform mat4 uVP;
uniform float uTime;
uniform vec4 uW[8];
uniform float uQ[8];
uniform sampler2D uRip;
uniform float uRipR;
out vec3 vWorld;
out vec3 vN;
out float vFoam;
void main(){
  vec2 s=sign(aUV); vec2 au=abs(aUV);
  vec2 p0=s*600.0*(exp(6.0*au)-1.0)/(exp(6.0)-1.0);
  float sp=0.0417*(max(abs(p0.x),abs(p0.y))+1.5);
  vec3 disp=vec3(0.0);
  float nx=0.0,nz=0.0,ny=0.0,jxx=0.0,jzz=0.0,jxz=0.0;
  for(int i=0;i<8;i++){
    vec4 w=uW[i]; float k=w.z; float L=6.2831853/k;
    float f=smoothstep(1.5*sp,4.5*sp,L);
    float om=sqrt(9.81*k);
    float th=k*dot(w.xy,p0)-om*uTime+float(i)*2.399;
    float sn=sin(th),cs=cos(th);
    float q=uQ[i]*f; float A=w.w*f;
    disp.xz+=w.xy*(q/k)*cs;
    disp.y+=A*sn;
    nx-=w.x*k*A*cs; nz-=w.y*k*A*cs; ny+=q*sn;
    jxx+=q*w.x*w.x*sn; jzz+=q*w.y*w.y*sn; jxz+=q*w.x*w.y*sn;
  }
  vec3 pos=vec3(p0.x+disp.x,disp.y,p0.y+disp.z);
  vN=vec3(nx,1.0-ny,nz);
  float J=(1.0-jxx)*(1.0-jzz)-jxz*jxz;
  vFoam=1.0-smoothstep(0.40,0.72,J);
  vec2 ruv=pos.xz/(2.0*uRipR)+0.5;
  float ef=smoothstep(0.0,0.08,min(min(ruv.x,1.0-ruv.x),min(ruv.y,1.0-ruv.y)));
  pos.y+=textureLod(uRip,ruv,0.0).r*ef;
  vWorld=pos;
  gl_Position=uVP*vec4(pos,1.0);
}`;

/* ---- Water fragment: fresnel, reflection, refraction, SSS, foam, glitter ---- */
const WATER_FS = HDR + COMMON + `
in vec3 vWorld; in vec3 vN; in float vFoam;
out vec4 o;
uniform vec3 uCam,uCamR,uCamF;
uniform float uRipR,uRipN,uA0;
uniform vec2 uRes,uNF;
uniform sampler2D uRip,uScene,uSceneD,uRefl;
float linZ(float d){float z=2.0*d-1.0;return 2.0*uNF.x*uNF.y/(uNF.y+uNF.x-z*(uNF.y-uNF.x));}
void main(){
  vec3 toCam=uCam-vWorld; float dist=length(toCam); vec3 V=toCam/dist;
  vec3 Nw=normalize(vN);
  vec2 s=Nw.xz/max(Nw.y,0.2);
  /* interactive ripples */
  vec2 ruv=vWorld.xz/(2.0*uRipR)+0.5;
  float ef=smoothstep(0.0,0.08,min(min(ruv.x,1.0-ruv.x),min(ruv.y,1.0-ruv.y)));
  float e=1.0/uRipN;
  float hl=texture(uRip,ruv-vec2(e,0.0)).r, hr=texture(uRip,ruv+vec2(e,0.0)).r;
  float hd=texture(uRip,ruv-vec2(0.0,e)).r, hu=texture(uRip,ruv+vec2(0.0,e)).r;
  vec2 grad=vec2(hr-hl,hu-hd)*(uRipN/(4.0*uRipR));
  s-=grad*ef*1.3;
  float foamSim=texture(uRip,ruv).g*ef;
  /* capillary detail */
  float df=1.0/(1.0+dist*0.035);
  vec2 t1=vWorld.xz*0.23+vec2(uTime*0.031,uTime*0.017);
  vec2 t2=vWorld.xz*0.61+vec2(-uTime*0.047,uTime*0.029);
  vec2 t3=vWorld.xz*1.7+vec2(uTime*0.071,-uTime*0.05);
  vec3 d1=texture(uDetail,t1).xyz*2.0-1.0;
  vec3 d2=texture(uDetail,t2).xyz*2.0-1.0;
  vec3 d3=texture(uDetail,t3).xyz*2.0-1.0;
  float dw=(0.40+0.55*uStorm)*df;
  s+=(d1.xz*0.8+d2.xz*0.6+d3.xz*0.35)*dw;
  s*=mix(1.0,0.5,smoothstep(60.0,400.0,dist));
  vec3 N=normalize(vec3(s.x,1.0,s.y));
  float nv=max(dot(N,V),0.0);
  float F=0.02+0.98*pow(1.0-nv,5.0);

  /* reflection */
  vec3 R=reflect(-V,N); R.y=abs(R.y);
  vec3 refl=skyCol(R,0.0);
  vec2 uv=gl_FragCoord.xy/uRes;
  vec2 off=vec2(dot(s,uCamR.xz),dot(s,normalize(uCamF.xz))*0.6);
  vec4 rb=texture(uRefl,clamp(uv+off*0.05,0.001,0.999));
  refl=mix(refl,dec(rb.rgb),rb.a);

  /* body colour with sub-surface scattering at crests */
  vec3 L=uSun;
  float hh=clamp(vWorld.y/(uA0*2.0+0.35)*0.5+0.5,0.0,1.0);
  float back=pow(clamp(dot(L,-V)*0.5+0.5,0.0,1.0),3.0);
  vec3 deep=vec3(0.005,0.040,0.078);
  vec3 tq=vec3(0.03,0.36,0.31);
  vec3 body=deep*(0.25+0.9*uAmbLum)
           +tq*uSunCol*back*hh*hh*0.16*clamp(L.y*2.5,0.0,1.0)
           +tq*0.05*uAmbLum*pow(1.0-nv,2.0)*(0.4+hh)
           +vec3(0.0,0.05,0.06)*uAmbLum*hh;
  body*=mix(vec3(1.0),uHorizon*1.4,0.25);

  /* refraction of submerged objects */
  float zW=linZ(gl_FragCoord.z);
  vec3 refr=body;
  vec2 uvq=clamp(uv+off*0.03,0.001,0.999);
  vec4 sc=vec4(0.0); float zS=0.0;
  vec4 c2=textureLod(uScene,uvq,0.0); float z2=linZ(textureLod(uSceneD,uvq,0.0).r);
  vec4 c1=textureLod(uScene,uv,0.0); float z1=linZ(textureLod(uSceneD,uv,0.0).r);
  if(c2.a>0.5&&z2>zW){sc=c2;zS=z2;}
  else if(c1.a>0.5&&z1>zW){sc=c1;zS=z1;}
  if(sc.a>0.5){
    float thick=max(zS-zW,0.0)*dist/zW;
    vec3 tr=exp(-thick*vec3(0.45,0.11,0.065)*(0.8+0.5*uStorm));
    refr=dec(sc.rgb)*tr+body*(1.0-tr);
  }

  vec3 col=mix(refr,refl,F);

  /* sun glitter (GGX) */
  vec3 H=normalize(L+V);
  float nh=max(dot(N,H),0.0);
  float a=0.035+0.07*uStorm+dist*0.00025; float a2=a*a;
  float dd=nh*nh*(a2-1.0)+1.0;
  float D=a2/(3.14159265*dd*dd);
  float vh=max(dot(V,H),0.0);
  float Fs=0.02+0.98*pow(1.0-vh,5.0);
  float nl=max(dot(N,L),0.0);
  vec3 spec=uSunCol*min(D*Fs/(4.0*max(nv,0.08)),22.0)*smoothstep(0.0,0.12,nl)*step(0.0,L.y);

  /* foam */
  float foamAmt=clamp(vFoam+foamSim*1.2,0.0,1.0);
  float fn=texture(uDetail,vWorld.xz*0.55+vec2(uTime*0.01,-uTime*0.013)).a*0.6
          +texture(uDetail,vWorld.xz*1.9-vec2(uTime*0.02,0.0)).a*0.4;
  float fm=smoothstep(1.0-foamAmt*1.15,1.0-foamAmt*1.15+0.18,fn);
  float foamLight=0.42*uAmbLum+0.22*uSunLum*max(dot(N,L),0.0);
  vec3 foamCol=vec3(0.94,0.97,1.0)*foamLight;
  col=mix(col+spec*(1.0-fm),foamCol,fm*0.92);

  /* horizon haze */
  float fog=smoothstep(100.0,580.0,dist);
  vec3 hd2=normalize(vec3(vWorld.x-uCam.x,0.02,vWorld.z-uCam.z));
  col=mix(col,skyCol(hd2,0.0),fog);

  vec3 outc=tonemap(col)+(hash12(gl_FragCoord.xy)-0.5)/255.0;
  o=vec4(outc,1.0);
}`;

/* ---- Sky ---- */
const SKY_VS = HDR + `
out vec2 vNdc;
void main(){
  vec2 p=vec2(float((gl_VertexID<<1)&2),float(gl_VertexID&2));
  vNdc=p*2.0-1.0;
  gl_Position=vec4(vNdc,1.0,1.0);
}`;
const SKY_FS = HDR + COMMON + `
in vec2 vNdc; out vec4 o;
uniform vec3 uCamF,uCamR,uCamU; uniform vec2 uTanAsp;
void main(){
  vec3 rd=normalize(uCamF+vNdc.x*uTanAsp.x*uTanAsp.y*uCamR+vNdc.y*uTanAsp.x*uCamU);
  vec3 c=skyCol(rd,1.0);
  o=vec4(tonemap(c)+(hash12(gl_FragCoord.xy)-0.5)/255.0,1.0);
}`;

/* ---- Balls ---- */
const BALL_VS = HDR + `
layout(location=0) in vec3 aPos;
uniform mat4 uVP; uniform vec3 uPos; uniform float uR; uniform mat3 uRot;
uniform float uMirror,uPlane;
out vec3 vWorld; out vec3 vWN; out vec3 vLocal;
void main(){
  vec3 wl=uRot*aPos;

function hash2(x,y,seed){

function updateSky(){

  const az=-0.5, ce=Math.cos(eps);
  sky.sun=[Math.sin(az)*ce,Math.sin(eps),-Math.cos(az)*ce];

  let h=lerp3([0.85,0.38,0.2],[0.62,0.77,0.92],Math.pow(day,0.7));

  {name:'Tennis ball',sub:'floats · fuzzy',       r:0.30, rho:0.37,  e:0.72, ic:0.667, sw:'radial-gradient(circle at 35% 30%,#e8f56a,#b5d11c 55%,#5e7108)'},

let selType=0, sizeMul=1, timeScale=1;
const balls=[]; const MAXBALLS=40;

function spawnBall(x,y,z,ti,vx=0,vy=0,vz=0){

function emit(x,y,z,vx,vy,vz,size,life){

    emit(b.x+Math.cos(a)*rho,b.wh+0.02,b.z+Math.sin(a)*rho,Math.cos(a)*out+b.vx*0.2,up,Math.sin(a)*out+b.vz*0.2,(0.03+Math.random()*0.07)*(0.5+b.r),0.9+Math.random()*0.9);

function particlesStep(dt){
  for(let i=pCount-1;i>=0;i--){
    PLife[i]-=dt; PVY[i]-=G*dt; const dr=1-0.5*dt; PVX[i]*=dr;PVZ[i]*=dr;
    PX[i]+=PVX[i]*dt;PY[i]+=PVY[i]*dt;PZ[i]+=PVZ[i]*dt;

      const l=--pCount; if(i!==l){PX[i]=PX[l];PY[i]=PY[l];PZ[i]=PZ[l];PVX[i]=PVX[l];PVY[i]=PVY[l];PVZ[i]=PVZ[l];PLife[i]=PLife[l];PSize[i]=PSize[l];PMax[i]=PMax[l];}

const S0={h:0,vx:0,vy:0,vz:0,ax:0,az:0}, S1={h:0,vx:0,vy:0,vz:0,ax:0,az:0};
let simT=0, stepCount=0, windX=0, windZ=0;
function capV(h,b){ let d=h-(b.y-b.r); if(d<=0)return 0; if(d>2*b.r)d=2*b.r; return Math.PI*d*d*(3*b.r-d)/3; }
let grab=null;

function stepBall(b,dt){
  const r=b.r,t=simT,o=0.65*r;

  const frac=Vs/b.V; b.frac=frac;

    b.vx-=ux*f;b.vy-=uy*f;b.vz-=uz*f;

      const k=0.5*RHO_A*Math.PI*r*r*r*airF/b.m;
      let mx=k*(b.wy*uz-b.wz*uy),my=k*(b.wz*ux-b.wx*uz),mz=k*(b.wx*uy-b.wy*ux);
      const ml=Math.hypot(mx,my,mz); if(ml>25){const s=25/ml;mx*=s;my*=s;mz*=s;}

    }
  }

const H=1/240;
function physicsStep(){

const cam={yaw:0.0,pitch:0.24,dist:13,tYaw:0.0,tPitch:0.24,tDist:13,target:[0,0.3,0]};

function computeCamera(){
  const cp=Math.cos(cam.pitch);
  eye=[cam.target[0]+cam.dist*Math.sin(cam.yaw)*cp, cam.target[1]+cam.dist*Math.sin(cam.pitch), cam.target[2]+cam.dist*Math.cos(cam.yaw)*cp];
  waveSample(eye[0],eye[2],simT,false,S1); const minY=S1.h+0.5; if(eye[1]<minY) eye[1]=minY;

  rx=-fz; ry=0; rz=fx; const rl=Math.hypot(rx,rz); rx/=rl;rz/=rl; camR=[rx,0,rz];
  camU=[ry*fz-rz*fy, rz*fx-rx*fz, rx*fy-ry*fx];

function rayFrom(px,py){

function pickBall(px,py){

    const bb=ox*d[0]+oy*d[1]+oz*d[2], c=ox*ox+oy*oy+oz*oz-R*R, disc=bb*bb-c;

}
const ptrs=new Map(); let pinch0=0, pinchDist0=13, downT=0, tapStart=null, lastHintHide=false;
function hideHint(){ if(lastHintHide)return; lastHintHide=true; $('hint').style.opacity=0; }
function setGrabTarget(x,y){
  if(!grab)return; const d=rayFrom(x,y);
  grab.ball.grab={x:eye[0]+d[0]*grab.depth,y:eye[1]+d[1]*grab.depth,z:eye[2]+d[2]*grab.depth};
}
function releaseGrab(){ if(grab){ grab.ball.grab=null; const b=grab.ball; b.wx+=(b.vz)*0.4/b.r*0.3; b.wz-=(b.vx)*0.4/b.r*0.3; grab=null; } }
canvas.addEventListener('pointerdown',e=>{
  e.preventDefault(); canvas.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY,t:performance.now(),moved:false});
  hideHint(); canvas.style.cursor='grabbing';
  if(ptrs.size===1){
    const hit=pickBall(e.clientX,e.clientY);
    if(hit){ grab={ball:hit.ball,pid:e.pointerId,depth:hit.t}; setGrabTarget(e.clientX,e.clientY); }
  } else {
    releaseGrab();
    const [a,b]=[...ptrs.values()]; pinch0=Math.hypot(a.x-b.x,a.y-b.y); pinchDist0=cam.tDist;
  }
});
canvas.addEventListener('pointermove',e=>{
  const p=ptrs.get(e.pointerId); if(!p)return;
  const dx=e.clientX-p.x,dy=e.clientY-p.y; p.x=e.clientX;p.y=e.clientY;
  if(Math.hypot(p.x-p.sx,p.y-p.sy)>7) p.moved=true;
  if(grab&&grab.pid===e.pointerId){ setGrabTarget(e.clientX,e.clientY); return; }
  if(ptrs.size===1&&p.moved){
    cam.tYaw-=dx*0.0055; cam.tPitch=clamp(cam.tPitch+dy*0.0045,0.02,1.45);
  } else if(ptrs.size===2){
    const [a,b]=[...ptrs.values()]; const d=Math.hypot(a.x-b.x,a.y-b.y);
    if(pinch0>10) cam.tDist=clamp(pinchDist0*pinch0/Math.max(d,10),3.5,45);
  }
});
function endPtr(e){
  const p=ptrs.get(e.pointerId); if(!p)return;
  const wasGrab=grab&&grab.pid===e.pointerId;
  if(wasGrab) releaseGrab();
  else if(ptrs.size===1&&!p.moved&&performance.now()-p.t<400&&e.type==='pointerup') spawnAtPointer(p.x,p.y);
  ptrs.delete(e.pointerId);
  if(ptrs.size<2) pinch0=0;
  if(ptrs.size===0) canvas.style.cursor='grab';
}
canvas.addEventListener('pointerup',endPtr);
canvas.addEventListener('pointercancel',endPtr);
canvas.addEventListener('wheel',e=>{e.preventDefault();cam.tDist=clamp(cam.tDist*Math.exp(e.deltaY*0.0012),3.5,45);},{passive:false});
['gesturestart','gesturechange','gestureend'].forEach(n=>document.addEventListener(n,e=>e.preventDefault()));
document.addEventListener('touchmove',e=>{ if(e.target===canvas) e.preventDefault(); },{passive:false});
canvas.addEventListener('contextmenu',e=>e.preventDefault());

/* ============================================================
   UI
   ============================================================ */
const chipsEl=$('chips');
TYPES.forEach((T,i)=>{
  const b=document.createElement('button'); b.className='chip'+(i===0?' on':'');
  b.innerHTML='<span class="sw" style="background:'+T.sw+'"></span><span>'+T.name+'<small>'+T.sub+'</small></span>';
  b.onclick=()=>{ selType=i; [...chipsEl.children].forEach((c,k)=>c.classList.toggle('on',k===i)); };
  chipsEl.appendChild(b);
});
function setFill(el){ el.style.setProperty('--p',((el.value-el.min)/(el.max-el.min)*100)+'%'); }
const sSize=$('sSize'),sSea=$('sSea'),sSun=$('sSun');
function seaName(v){return v<12?'Glassy':v<30?'Calm':v<50?'Moderate':v<72?'Rough':v<90?'Very rough':'Storm';}
function sunName(v){return v<12?'Sunset':v<30?'Golden hour':v<62?'Afternoon':'Midday';}
sSize.oninput=()=>{sizeMul=sSize.value/100;$('vSize').textContent=sizeMul.toFixed(1)+'×';setFill(sSize);};
sSea.oninput=()=>{seaT=sSea.value/100;$('vSea').textContent=seaName(+sSea.value);setFill(sSea);};
sSun.oninput=()=>{sunV=sSun.value/100;$('vSun').textContent=sunName(+sSun.value);setFill(sSun);};
[sSize,sSea,sSun].forEach(s=>{s.oninput();});
$('bDrop').onclick=()=>{ hideHint(); spawnBall((Math.random()-0.5)*3,4.5,(Math.random()-0.5)*3,selType); };
$('bRain').onclick=()=>{ hideHint(); for(let i=0;i<10;i++){ setTimeout(()=>{ const prev=selType; spawnBall((Math.random()-0.5)*11,5+Math.random()*5,(Math.random()-0.5)*11,Math.floor(Math.random()*TYPES.length)); },i*110); } };
$('bClear').onclick=()=>{ balls.length=0; grab=null; };
$('bSlow').onclick=e=>{ timeScale=timeScale===1?0.2:1; e.currentTarget.classList.toggle('on',timeScale!==1); };
$('bHide').onclick=()=>{ $('dock').classList.add('hidden'); $('fab').classList.add('show'); };
$('fab').onclick=()=>{ $('dock').classList.remove('hidden'); $('fab').classList.remove('show'); };
setTimeout(hideHint,14000);

/* ============================================================
   Rendering
   ============================================================ */
const maxPR=Math.min(window.devicePixelRatio||1,2);
let pr=Math.min(maxPR,1.5), prCeil=maxPR, curW=0, curH=0;
function resize(){
  const w=Math.max(2,Math.floor(innerWidth*pr)), h=Math.max(2,Math.floor(innerHeight*pr));
  if(w!==curW||h!==curH){ curW=w;curH=h;canvas.width=w;canvas.height=h; makeTargets(w,h); }
}
addEventListener('resize',resize); addEventListener('orientationchange',()=>setTimeout(resize,200));

function drawBalls(mode,mirror){
  if(balls.length===0) return;
  gl.useProgram(pBall); setSky(pBall);
  gl.uniformMatrix4fv(L(pBall,'uVP'),false,VP);
  gl.uniform1f(L(pBall,'uMode'),mode); gl.uniform1f(L(pBall,'uMirror'),mirror);
  gl.bindVertexArray(sphereVAO);
  for(const b of balls){
    const q=b.q,x=q[0],y=q[1],z=q[2],w=q[3],m=b.rot;
    m[0]=1-2*(y*y+z*z);m[1]=2*(x*y+w*z);m[2]=2*(x*z-w*y);
    m[3]=2*(x*y-w*z);m[4]=1-2*(x*x+z*z);m[5]=2*(y*z+w*x);
    m[6]=2*(x*z+w*y);m[7]=2*(y*z-w*x);m[8]=1-2*(x*x+y*y);
    gl.uniform3f(L(pBall,'uPos'),b.x,b.y,b.z); gl.uniform1f(L(pBall,'uR'),b.r);
    gl.uniformMatrix3fv(L(pBall,'uRot'),false,m);
    gl.uniform1f(L(pBall,'uType'),b.type); gl.uniform1f(L(pBall,'uPlane'),b.wh);
    gl.uniform3f(L(pBall,'uCamEff'),eye[0],mirror?2*b.wh-eye[1]:eye[1],eye[2]);
    gl.drawElements(gl.TRIANGLES,sphereIdxCount,gl.UNSIGNED_SHORT,0);
  }
  gl.bindVertexArray(null);
}

function render(){
  const W=canvas.width,Hh=canvas.height;
  computeCamera();
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,texDetail);
  gl.enable(gl.DEPTH_TEST); gl.depthFunc(gl.LEQUAL); gl.disable(gl.BLEND); gl.depthMask(true);

  /* reflection pass (mirrored balls) */
  gl.bindFramebuffer(gl.FRAMEBUFFER,refl.fb); gl.viewport(0,0,rW,rH);
  gl.clearColor(0,0,0,0); gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
  drawBalls(1,1);
  /* scene pass (colour+depth for refraction) */
  gl.bindFramebuffer(gl.FRAMEBUFFER,scene.fb); gl.viewport(0,0,W,Hh);
  gl.clearColor(0,0,0,0); gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
  drawBalls(1,0);

  /* main pass */
  gl.bindFramebuffer(gl.FRAMEBUFFER,null); gl.viewport(0,0,W,Hh);
  gl.clearColor(0,0,0,1); gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
  gl.disable(gl.DEPTH_TEST);
  gl.useProgram(pSky); setSky(pSky);
  gl.uniform3fv(L(pSky,'uCamF'),camF); gl.uniform3fv(L(pSky,'uCamR'),camR); gl.uniform3fv(L(pSky,'uCamU'),camU);
  gl.uniform2f(L(pSky,'uTanAsp'),tanH,aspect);
  gl.bindVertexArray(emptyVAO); gl.drawArrays(gl.TRIANGLES,0,3);
  gl.enable(gl.DEPTH_TEST);

  gl.useProgram(pWater); setSky(pWater);
  gl.uniformMatrix4fv(L(pWater,'uVP'),false,VP);
  gl.uniform3fv(L(pWater,'uCam'),eye); gl.uniform3fv(L(pWater,'uCamR'),camR); gl.uniform3fv(L(pWater,'uCamF'),camF);
  gl.uniform4fv(L(pWater,'uW'),uWArr); gl.uniform1fv(L(pWater,'uQ'),uQArr);
  gl.uniform1f(L(pWater,'uRipR'),RR); gl.uniform1f(L(pWater,'uRipN'),RN); gl.uniform1f(L(pWater,'uA0'),waveA0);
  gl.uniform2f(L(pWater,'uRes'),W,Hh); gl.uniform2f(L(pWater,'uNF'),0.1,3000);
  gl.uniform1i(L(pWater,'uRip'),1); gl.uniform1i(L(pWater,'uScene'),2); gl.uniform1i(L(pWater,'uSceneD'),3); gl.uniform1i(L(pWater,'uRefl'),4);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D,texRip);
  gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D,scene.color);
  gl.activeTexture(gl.TEXTURE3); gl.bindTexture(gl.TEXTURE_2D,scene.depth);
  gl.activeTexture(gl.TEXTURE4); gl.bindTexture(gl.TEXTURE_2D,refl.color);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindVertexArray(waterVAO); gl.drawElements(gl.TRIANGLES,waterIdxCount,gl.UNSIGNED_INT,0);
  gl.bindVertexArray(null);

  /* balls above the surface */
  drawBalls(0,0);

  /* spray */
  if(pCount>0){
    for(let i=0;i<pCount;i++){
      const o=i*5; partData[o]=PX[i];partData[o+1]=PY[i];partData[o+2]=PZ[i];
      const lf=PLife[i]/PMax[i]; partData[o+3]=PSize[i]*(0.6+0.4*lf); partData[o+4]=Math.min(1,PLife[i]/0.35)*0.75;
    }
    gl.bindBuffer(gl.ARRAY_BUFFER,partBuf); gl.bufferSubData(gl.ARRAY_BUFFER,0,partData,0,pCount*5);
    gl.useProgram(pPart); setSky(pPart);
    gl.uniformMatrix4fv(L(pPart,'uVP'),false,VP);
    gl.uniform1f(L(pPart,'uPx'),Hh/(2*tanH));
    gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA); gl.depthMask(false);
    gl.bindVertexArray(partVAO); gl.drawArrays(gl.POINTS,0,pCount); gl.bindVertexArray(null);
    gl.depthMask(true); gl.disable(gl.BLEND);
  }
}

/* ============================================================
   Main loop with adaptive resolution
   ============================================================ */
let lastT=performance.now(), acc=0, ema=16.7, frameN=0, lastStat=0, cool=0, ceilTimer=0, fpsShown=60;
function frame(now){
  requestAnimationFrame(frame);
  const rdtMs=now-lastT; lastT=now; if(!(rdtMs>0)) return;
  const dt=Math.min(rdtMs/1000,0.05);
  ema=ema*0.94+Math.min(rdtMs,100)*0.06; frameN++; cool--; ceilTimer+=dt;
  if(cool<=0&&frameN>40){
    if(ema>20.5&&pr>0.65){ prCeil=Math.max(0.7,pr-0.05); pr=Math.max(0.65,pr-0.12); cool=60; resize(); }
    else if(ema<17.6&&pr<prCeil-0.001){ pr=Math.min(prCeil,pr+0.06); cool=120; resize(); }
  }
  if(ceilTimer>25){ ceilTimer=0; prCeil=Math.min(maxPR,prCeil+0.1); }
  resize();

  sea+=(seaT-sea)*Math.min(1,dt*1.6);
  updateWaves(sea); updateSky();
  const ws=2.5+11*sea; windX=Math.sin(WIND_ANG)*ws; windZ=Math.cos(WIND_ANG)*ws;

  cam.yaw+=(cam.tYaw-cam.yaw)*Math.min(1,dt*10);
  cam.pitch+=(cam.tPitch-cam.pitch)*Math.min(1,dt*10);
  cam.dist+=(cam.tDist-cam.dist)*Math.min(1,dt*8);

  acc+=dt*timeScale; let steps=0;
  while(acc>=H&&steps<12){ physicsStep(); acc-=H; steps++; }
  if(steps>=12) acc=0;
  particlesStep(dt*timeScale);
  uploadRipple();
  render();

  if(now-lastStat>500){
    lastStat=now; fpsShown=Math.round(1000/ema);
    $('stats').innerHTML=Math.min(fpsShown,120)+' fps · '+balls.length+' balls<br>render '+pr.toFixed(2)+'× · sea '+Math.round(sea*100)+'%';
  }
}
resize();
requestAnimationFrame(t=>{ lastT=t; frame(t); });

/* a couple of balls to start with */
spawnBall(-2.2,3.6,1.0,0,0,0,0);
spawnBall(0.6,5.2,-0.4,1,0,0,0);
spawnBall(2.6,6.4,0.8,5,0,0,0);
</script>
