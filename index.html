<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#06121c">
<meta name="description" content="Aqua – a real-time ocean and ball physics showcase with realistic splashes.">
<title>Aqua · Ocean &amp; Ball Physics Showcase</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body class="booting">
<canvas id="gl"></canvas>

<!-- cinematic overlays -->
<div id="vig" aria-hidden="true"></div>
<div id="slowBadge" class="glass" aria-hidden="true"><span class="rec"></span>Slow-mo <b>0.2×</b></div>

<header id="top">
  <div class="brand glass">
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 36 36">
        <defs><clipPath id="lc"><rect width="36" height="36" rx="12"/></clipPath></defs>
        <g clip-path="url(#lc)">
          <path class="lw lw2" d="M-36 22c6-5 12-5 18 0s12 5 18 0 12-5 18 0 12 5 18 0 12-5 18 0v20h-90z"/>
          <path class="lw lw1" d="M-36 25c6-4 12-4 18 0s12 4 18 0 12-4 18 0 12 4 18 0 12-4 18 0v20h-90z"/>
          <circle class="ld" cx="18" cy="11" r="4.2"/>
        </g>
      </svg>
    </div>
    <div class="brand-txt"><h1>Aqua</h1><p>Ocean &amp; ball physics showcase</p></div>
  </div>
  <div class="stats glass" id="stats">
    <div class="st"><span class="live"></span><b id="stFps">60</b><i>fps</i></div>
    <div class="st"><b id="stBalls">0</b><i>balls</i></div>
    <div class="st wide"><b id="stRes">1.00×</b><i>render</i></div>
    <div class="st wide"><b id="stSea">38%</b><i>sea</i></div>
  </div>
</header>

<div id="hint" class="glass">
  <span class="tap" aria-hidden="true"><i></i></span>
  <span>Tap the sea to drop a ball · Drag to orbit · Pinch to zoom · Grab a ball and fling it</span>
</div>

<div id="toasts" aria-live="polite"></div>

<section id="dock" class="glass">
  <div class="grip" aria-hidden="true"></div>
  <div class="chips" id="chips"><span class="chip-ind" id="chipInd" aria-hidden="true"></span></div>
  <div class="row">
    <label class="ctl"><span class="lab">Ball size <b id="vSize">1.0×</b></span><input id="sSize" type="range" min="50" max="220" value="100"></label>
    <label class="ctl"><span class="lab">Sea state <b id="vSea">Moderate</b></span><input id="sSea" type="range" min="0" max="100" value="38"></label>
    <label class="ctl"><span class="lab">Sun <b id="vSun">Afternoon</b></span><input id="sSun" type="range" min="0" max="100" value="58"></label>
  </div>
  <div class="acts">
    <button class="btn primary" id="bDrop" title="Drop ball (Space)">
      <svg class="ic ic-drop" viewBox="0 0 24 24"><path d="M12 3c3.5 4.4 6 7.6 6 11a6 6 0 0 1-12 0c0-3.4 2.5-6.6 6-11z"/></svg><span>Drop ball</span>
    </button>
    <button class="btn" id="bRain" title="Ball rain (R)">
      <svg class="ic ic-rain" viewBox="0 0 24 24"><path d="M7 15a4.5 4.5 0 0 1 .6-9A6 6 0 0 1 19 8.2 3.5 3.5 0 0 1 18 15z"/><path class="d d1" d="M8.5 18v2.5"/><path class="d d2" d="M12.5 18v2.5"/><path class="d d3" d="M16.5 18v2.5"/></svg><span>Ball rain</span>
    </button>
    <button class="btn" id="bSlow" title="Slow motion (S)">
      <svg class="ic ic-slow" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path class="hand" d="M12 12V7"/><path d="M12 12l3 2"/></svg><span>Slow-mo</span>
    </button>
    <button class="btn" id="bClear" title="Clear (C)">
      <svg class="ic ic-clear" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg><span>Clear</span>
    </button>
    <button class="btn ghost" id="bHide" title="Hide controls (H)">
      <svg class="ic ic-chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg><span>Hide</span>
    </button>
  </div>
</section>
<button id="fab" class="glass" title="Show controls (H)">
  <svg class="ic" viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg><span>Controls</span>
</button>

<!-- intro -->
<div id="intro" aria-hidden="true">
  <div class="orb glass">
    <span class="idrop"></span>
    <span class="iring"></span><span class="iring"></span><span class="iring"></span>
  </div>
  <div class="ititle"><span>A</span><span>q</span><span>u</span><span>a</span></div>
  <div class="isub">filling the ocean…</div>
</div>

<div id="fail">This showcase needs WebGL 2 (iPadOS 15+ / Safari 15+). Please update your device or browser.</div>
<div id="err"></div>

<!-- Plain scripts, loaded in order (no build step, works from any static host) -->
<script src="js/core.js"></script>      <!-- WebGL context, math helpers -->
<script src="js/shaders.js"></script>   <!-- GLSL: water, sky, balls, splash particles -->
<script src="js/ocean.js"></script>     <!-- textures, geometry, waves, ripple sim, sky -->
<script src="js/splash.js"></script>    <!-- splash VFX: crown, jet, mist, rain-back -->
<script src="js/physics.js"></script>   <!-- rigid-body ball physics -->
<script src="js/input.js"></script>     <!-- camera, pointer & touch input -->
<script src="js/ui.js"></script>        <!-- glass UI behaviour -->
<script src="js/render.js"></script>    <!-- render passes + main loop -->
</body>
</html>
